<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <title>Crane riding a bicycle on a seaside road</title>
  <desc>Flat vector cartoon: a white crane with green cap and red scarf rides a bicycle on a sunny seaside road with lighthouse, sea, clouds and animated wheels.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ED6F5"/>
      <stop offset="0.6" stop-color="#BEE9FA"/>
      <stop offset="1" stop-color="#E8F8FD"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD0EE"/>
      <stop offset="0.45" stop-color="#58AEDD"/>
      <stop offset="1" stop-color="#2F82C2"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE27A" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#FFE27A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFE27A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A505A"/>
      <stop offset="1" stop-color="#333842"/>
    </linearGradient>
    <clipPath id="lighthouseClip">
      <path d="M1042,458 L1053,344 L1083,344 L1094,458 Z"/>
    </clipPath>
  </defs>

  <!-- SKY -->
  <rect x="0" y="0" width="1200" height="480" fill="url(#sky)"/>

  <!-- SUN -->
  <g>
    <circle cx="150" cy="118" r="105" fill="url(#sunGlow)">
      <animate attributeName="r" values="98;116;98" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="118" r="46" fill="#FFD93B" stroke="#F4B92A" stroke-width="4">
      <animate attributeName="r" values="45;48;45" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CLOUDS -->
  <g fill="#FFFFFF" opacity="0.95">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 0; 0 0" dur="26s" repeatCount="indefinite"/>
      <ellipse cx="330" cy="110" rx="52" ry="24"/>
      <ellipse cx="372" cy="96" rx="40" ry="21"/>
      <ellipse cx="288" cy="120" rx="38" ry="17"/>
      <ellipse cx="336" cy="124" rx="64" ry="18"/>
    </g>
    <g opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 0; -55 0; 0 0" dur="32s" repeatCount="indefinite"/>
      <ellipse cx="770" cy="95" rx="44" ry="20"/>
      <ellipse cx="808" cy="84" rx="32" ry="16"/>
      <ellipse cx="738" cy="104" rx="32" ry="14"/>
      <ellipse cx="774" cy="108" rx="54" ry="15"/>
    </g>
    <g opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="0 0; 45 0; 0 0" dur="22s" repeatCount="indefinite"/>
      <ellipse cx="600" cy="185" rx="32" ry="14"/>
      <ellipse cx="628" cy="177" rx="23" ry="11"/>
      <ellipse cx="582" cy="191" rx="22" ry="10"/>
    </g>
    <g opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0; -40 0; 0 0" dur="28s" repeatCount="indefinite"/>
      <ellipse cx="1020" cy="190" rx="30" ry="13"/>
      <ellipse cx="1046" cy="183" rx="21" ry="10"/>
      <ellipse cx="1002" cy="196" rx="20" ry="9"/>
    </g>
  </g>

  <!-- TINY FLYING BIRDS -->
  <g stroke="#5A6B7B" stroke-width="3" fill="none" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 30 -8; 0 0" dur="12s" repeatCount="indefinite"/>
      <path d="M250,180 Q257,171 264,180 Q271,171 278,180">
        <animate attributeName="d" dur="0.55s" repeatCount="indefinite"
          values="M250,180 Q257,171 264,180 Q271,171 278,180;
                  M250,180 Q257,186 264,180 Q271,186 278,180;
                  M250,180 Q257,171 264,180 Q271,171 278,180"/>
      </path>
      <path d="M320,152 Q326,144 332,152 Q338,144 344,152">
        <animate attributeName="d" dur="0.5s" begin="0.15s" repeatCount="indefinite"
          values="M320,152 Q326,144 332,152 Q338,144 344,152;
                  M320,152 Q326,158 332,152 Q338,158 344,152;
                  M320,152 Q326,144 332,152 Q338,144 344,152"/>
      </path>
      <path d="M392,192 Q397,185 402,192 Q407,185 412,192">
        <animate attributeName="d" dur="0.6s" begin="0.3s" repeatCount="indefinite"
          values="M392,192 Q397,185 402,192 Q407,185 412,192;
                  M392,192 Q397,198 402,192 Q407,198 412,192;
                  M392,192 Q397,185 402,192 Q407,185 412,192"/>
      </path>
    </g>
  </g>

  <!-- DISTANT HILLS -->
  <path d="M0,472 L0,436 Q130,378 270,428 Q390,392 520,438 Q650,400 780,442 Q900,408 1030,444 L1200,426 L1200,472 Z" fill="#A9C6D8"/>
  <path d="M0,472 Q150,432 330,460 Q520,434 700,464 Q900,438 1200,466 L1200,472 Z" fill="#8FB6A6"/>

  <!-- LIGHTHOUSE HEADLAND -->
  <path d="M948,480 Q1010,440 1075,446 Q1142,452 1190,480 Z" fill="#7FAF6E" stroke="#5E8C50" stroke-width="3"/>
  <!-- LIGHTHOUSE -->
  <g>
    <path d="M1042,458 L1053,344 L1083,344 L1094,458 Z" fill="#FFFFFF" stroke="#3B3F45" stroke-width="3.5"/>
    <g clip-path="url(#lighthouseClip)" fill="#E23B3B">
      <rect x="1035" y="352" width="70" height="14"/>
      <rect x="1035" y="380" width="70" height="14"/>
      <rect x="1035" y="408" width="70" height="14"/>
      <rect x="1035" y="436" width="70" height="14"/>
    </g>
    <rect x="1052" y="326" width="32" height="20" fill="#37414F" stroke="#3B3F45" stroke-width="3"/>
    <path d="M1050,326 Q1068,308 1086,326 Z" fill="#E23B3B" stroke="#3B3F45" stroke-width="3"/>
    <circle cx="1068" cy="336" r="5" fill="#FFE27A">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- SEA -->
  <rect x="0" y="468" width="1200" height="148" fill="url(#sea)"/>
  <rect x="0" y="468" width="1200" height="4" fill="#DFF3FB" opacity="0.8"/>
  <!-- SHIMMER -->
  <g fill="#FFFFFF">
    <rect x="140" y="500" width="44" height="5" rx="2.5" opacity="0.4">
      <animate attributeName="opacity" values="0.15;0.65;0.15" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="330" y="522" width="60" height="5" rx="2.5" opacity="0.4">
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="520" y="498" width="36" height="5" rx="2.5" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.9s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="700" y="540" width="55" height="5" rx="2.5" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.55;0.1" dur="2.4s" begin="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="880" y="510" width="46" height="5" rx="2.5" opacity="0.4">
      <animate attributeName="opacity" values="0.15;0.65;0.15" dur="2.1s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="1030" y="556" width="50" height="5" rx="2.5" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.8s" begin="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="240" y="572" width="60" height="5" rx="2.5" opacity="0.4">
      <animate attributeName="opacity" values="0.12;0.55;0.12" dur="2.5s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="600" y="585" width="42" height="5" rx="2.5" opacity="0.4">
      <animate attributeName="opacity" values="0.12;0.6;0.12" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- PIER RAILING -->
  <g>
    <g fill="#8B5E3C">
      <rect x="40" y="592" width="8" height="24"/><rect x="120" y="592" width="8" height="24"/>
      <rect x="200" y="592" width="8" height="24"/><rect x="280" y="592" width="8" height="24"/>
      <rect x="360" y="592" width="8" height="24"/><rect x="440" y="592" width="8" height="24"/>
      <rect x="520" y="592" width="8" height="24"/><rect x="600" y="592" width="8" height="24"/>
      <rect x="680" y="592" width="8" height="24"/><rect x="760" y="592" width="8" height="24"/>
      <rect x="840" y="592" width="8" height="24"/><rect x="920" y="592" width="8" height="24"/>
      <rect x="1000" y="592" width="8" height="24"/><rect x="1080" y="592" width="8" height="24"/>
      <rect x="1160" y="592" width="8" height="24"/>
    </g>
    <rect x="0" y="596" width="1200" height="7" fill="#A9714B" stroke="#6E4527" stroke-width="2"/>
    <rect x="0" y="608" width="1200" height="6" fill="#A9714B" stroke="#6E4527" stroke-width="2"/>
  </g>

  <!-- CURB + ROAD -->
  <rect x="0" y="616" width="1200" height="12" fill="#C9CDD4"/>
  <rect x="0" y="628" width="1200" height="172" fill="url(#road)"/>
  <rect x="0" y="646" width="1200" height="4" fill="#E7EAF0" opacity="0.5"/>
  <!-- moving lane dashes -->
  <line x1="-60" y1="762" x2="1260" y2="762" stroke="#F6C93F" stroke-width="9" stroke-dasharray="62 46" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="108" dur="0.42s" repeatCount="indefinite"/>
  </line>
  <line x1="-60" y1="700" x2="1260" y2="700" stroke="#8B93A0" stroke-width="4" stroke-dasharray="40 60" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="0.42s" repeatCount="indefinite"/>
  </line>

  <!-- SHADOW -->
  <ellipse cx="580" cy="740" rx="190" ry="16" fill="#000000" opacity="0.18"/>

  <!-- ================= RIDER + BICYCLE (with gentle bob) ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 2.5; 0 0" dur="0.52s" repeatCount="indefinite"/>

    <!-- FAR LEG (behind bike) -->
    <g stroke="#E8862E" stroke-linecap="round">
      <line x1="518" y1="518" x2="550" y2="655" stroke-width="9">
        <animate attributeName="x2" dur="1.1s" repeatCount="indefinite"
          values="550;559;580;601;610;601;580;559;550"/>
        <animate attributeName="y2" dur="1.1s" repeatCount="indefinite"
          values="655;634;625;634;655;676;685;676;655"/>
      </line>
      <ellipse cx="550" cy="655" rx="9" ry="6" fill="#E8862E" stroke="#B9631A" stroke-width="2">
        <animate attributeName="cx" dur="1.1s" repeatCount="indefinite"
          values="550;559;580;601;610;601;580;559;550"/>
        <animate attributeName="cy" dur="1.1s" repeatCount="indefinite"
          values="655;634;625;634;655;676;685;676;655"/>
      </ellipse>
    </g>

    <!-- REAR WHEEL -->
    <g transform="translate(455,655)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.45s" repeatCount="indefinite"/>
        <circle r="64" fill="none" stroke="#F5E9D0" stroke-width="7"/>
        <g stroke="#98A0AA" stroke-width="3.5">
          <line x1="-62" y1="0" x2="62" y2="0"/>
          <line x1="0" y1="-62" x2="0" y2="62"/>
          <line x1="-44" y1="-44" x2="44" y2="44"/>
          <line x1="-44" y1="44" x2="44" y2="-44"/>
        </g>
        <circle r="77" fill="none" stroke="#23272E" stroke-width="13"/>
        <circle r="77" fill="none" stroke="#14161A" stroke-width="13" stroke-dasharray="4 16"/>
      </g>
      <circle r="10" fill="#C8CDD4" stroke="#3B3F45" stroke-width="3"/>
      <circle r="13" fill="#CBD1D8" stroke="#3B3F45" stroke-width="3"/>
    </g>

    <!-- FRONT WHEEL -->
    <g transform="translate(705,655)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.45s" repeatCount="indefinite"/>
        <circle r="64" fill="none" stroke="#F5E9D0" stroke-width="7"/>
        <g stroke="#98A0AA" stroke-width="3.5">
          <line x1="-62" y1="0" x2="62" y2="0"/>
          <line x1="0" y1="-62" x2="0" y2="62"/>
          <line x1="-44" y1="-44" x2="44" y2="44"/>
          <line x1="-44" y1="44" x2="44" y2="-44"/>
        </g>
        <circle r="77" fill="none" stroke="#23272E" stroke-width="13"/>
        <circle r="77" fill="none" stroke="#14161A" stroke-width="13" stroke-dasharray="4 16"/>
      </g>
      <circle r="10" fill="#C8CDD4" stroke="#3B3F45" stroke-width="3"/>
    </g>

    <!-- CHAIN -->
    <path d="M556,629 L468,642 A13,13 0 0 0 468,668 L556,681 A26,26 0 0 0 556,629 Z"
          fill="none" stroke="#2A2E35" stroke-width="4.5" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.18s" repeatCount="indefinite"/>
    </path>

    <!-- FRAME -->
    <g stroke-linecap="round" fill="none">
      <g stroke="#9E2F18" stroke-width="14">
        <path d="M455,655 L516,550"/>
        <path d="M455,655 L580,655"/>
        <path d="M580,655 L516,550"/>
        <path d="M516,550 L670,528"/>
        <path d="M580,655 L678,552"/>
        <path d="M670,528 L682,560"/>
        <path d="M682,560 L705,655"/>
      </g>
      <g stroke="#E8542F" stroke-width="8">
        <path d="M455,655 L516,550"/>
        <path d="M455,655 L580,655"/>
        <path d="M580,655 L516,550"/>
        <path d="M516,550 L670,528"/>
        <path d="M580,655 L678,552"/>
        <path d="M670,528 L682,560"/>
        <path d="M682,560 L705,655"/>
      </g>
    </g>

    <!-- REAR RACK + PANNIER -->
    <g>
      <path d="M448,586 L522,584" stroke="#3B3F45" stroke-width="6" stroke-linecap="round"/>
      <path d="M455,650 L452,590" stroke="#3B3F45" stroke-width="5" stroke-linecap="round"/>
      <path d="M538,592 L520,585" stroke="#3B3F45" stroke-width="5" stroke-linecap="round"/>
      <rect x="446" y="586" width="68" height="52" rx="9" fill="#4C9A4C" stroke="#2F6B31" stroke-width="3.5"/>
      <path d="M446,602 L514,602" stroke="#2F6B31" stroke-width="3"/>
      <rect x="472" y="596" width="14" height="12" rx="3" fill="#D9B44A" stroke="#2F6B31" stroke-width="2.5"/>
    </g>

    <!-- SADDLE -->
    <path d="M470,538 Q490,528 522,534 Q540,538 542,545 Q520,552 492,549 Q474,546 470,538 Z"
          fill="#2B2F36" stroke="#14161A" stroke-width="3"/>
    <path d="M516,550 L520,540" stroke="#3B3F45" stroke-width="6"/>

    <!-- SEATPOST to body -->
    <!-- HANDLEBAR -->
    <g stroke="#2B2F36" stroke-linecap="round" fill="none">
      <path d="M671,531 L676,510" stroke-width="8"/>
      <path d="M648,514 Q672,500 704,516" stroke-width="8"/>
    </g>
    <ellipse cx="702" cy="518" rx="8" ry="6" fill="#8B5E3C" stroke="#3B3F45" stroke-width="2.5"/>
    <ellipse cx="650" cy="514" rx="7" ry="6" fill="#8B5E3C" stroke="#3B3F45" stroke-width="2.5"/>

    <!-- FRONT BASKET -->
    <g>
      <path d="M700,550 L756,550 L748,596 L710,596 Z" fill="#D9A05B" stroke="#7C5426" stroke-width="3.5"/>
      <g stroke="#7C5426" stroke-width="2.5">
        <path d="M703,562 L754,562"/>
        <path d="M706,576 L751,576"/>
        <path d="M718,550 L715,596"/>
        <path d="M730,550 L728,596"/>
        <path d="M742,550 L739,596"/>
      </g>
      <rect x="697" y="545" width="62" height="9" rx="4.5" fill="#C08A4A" stroke="#7C5426" stroke-width="3"/>
    </g>

    <!-- BIRD BODY -->
    <g>
      <!-- tail -->
      <path d="M452,470 Q418,452 404,462 Q424,470 420,480 Q400,478 392,488 Q424,502 458,498 Z"
            fill="#F4F6F8" stroke="#3B3F45" stroke-width="3.5"/>
      <!-- scarf (behind body) -->
      <path fill="#E23B3B" stroke="#A32323" stroke-width="3">
        <animate attributeName="d" dur="0.7s" repeatCount="indefinite"
          values="M546,450 C512,444 486,462 452,450 C428,442 408,454 388,448 L392,466 C414,472 442,458 468,470 C500,482 530,470 552,468 Z;
                  M546,450 C512,452 486,444 452,458 C428,466 408,450 388,458 L392,474 C414,464 442,478 468,462 C500,452 530,470 552,468 Z;
                  M546,450 C512,444 486,462 452,450 C428,442 408,454 388,448 L392,466 C414,472 442,458 468,470 C500,482 530,470 552,468 Z"/>
      </path>
      <!-- body -->
      <ellipse cx="505" cy="492" rx="62" ry="50" fill="#FFFFFF" stroke="#3B3F45" stroke-width="3.5" transform="rotate(-8 505 492)"/>
      <!-- feather hints -->
      <path d="M452,486 Q464,494 458,506 M468,500 Q480,508 474,520" stroke="#C9D2DA" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- neck -->
      <path d="M528,462 Q546,436 562,428 L590,448 Q566,466 552,478 Z" fill="#FFFFFF" stroke="#3B3F45" stroke-width="3.5"/>
      <!-- scarf knot -->
      <path d="M534,446 Q552,436 566,448 Q556,466 538,462 Z" fill="#E23B3B" stroke="#A32323" stroke-width="3"/>
      <!-- head -->
      <circle cx="574" cy="420" r="33" fill="#FFFFFF" stroke="#3B3F45" stroke-width="3.5"/>
      <!-- beak -->
      <path d="M596,418 L681,433 Q693,438 681,447 Q648,461 615,458 Q594,453 591,437 Q590,424 596,418 Z"
            fill="#F97A1E" stroke="#B85310" stroke-width="3"/>
      <path d="M597,434 Q640,441 680,443" stroke="#B85310" stroke-width="3" fill="none"/>
      <circle cx="612" cy="428" r="2.2" fill="#B85310"/>
      <!-- eye -->
      <circle cx="583" cy="424" r="6.5" fill="#2B2B2B"/>
      <circle cx="585" cy="421.5" r="2.3" fill="#FFFFFF"/>
      <!-- cap -->
      <g transform="rotate(-8 574 418)">
        <path d="M546,408 A30,30 0 0 1 604,404 L604,409 Q575,417 546,412 Z" fill="#3FA34D" stroke="#2F6B31" stroke-width="3"/>
        <path d="M596,403 Q622,395 636,403 Q622,411 598,410 Z" fill="#2F6B31" stroke="#234F24" stroke-width="2.5"/>
        <circle cx="575" cy="379" r="4.5" fill="#2F6B31"/>
      </g>
      <!-- wing reaching to handlebar -->
      <path d="M520,470 Q568,446 616,470 Q662,492 700,514 L697,529 Q682,533 668,525 Q620,501 572,493 Q536,487 520,482 Z"
            fill="#F4F6F8" stroke="#3B3F45" stroke-width="3.5"/>
      <path d="M560,472 Q580,478 598,486" stroke="#C9D2DA" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="701" cy="520" rx="11" ry="8" fill="#F4F6F8" stroke="#3B3F45" stroke-width="3" transform="rotate(20 701 520)"/>
    </g>

    <!-- NEAR LEG -->
    <g stroke="#F09A3E" stroke-linecap="round">
      <line x1="538" y1="522" x2="610" y2="655" stroke-width="10">
        <animate attributeName="x2" dur="1.1s" repeatCount="indefinite"
          values="610;601;580;559;550;559;580;601;610"/>
        <animate attributeName="y2" dur="1.1s" repeatCount="indefinite"
          values="655;676;685;676;655;634;625;634;655"/>
      </line>
      <ellipse cx="610" cy="655" rx="10" ry="7" fill="#F09A3E" stroke="#B9631A" stroke-width="2.5">
        <animate attributeName="cx" dur="1.1s" repeatCount="indefinite"
          values="610;601;580;559;550;559;580;601;610"/>
        <animate attributeName="cy" dur="1.1s" repeatCount="indefinite"
          values="655;676;685;676;655;634;625;634;655"/>
      </ellipse>
    </g>

    <!-- CHAINRING + CRANK + PEDALS -->
    <g transform="translate(580,655)">
      <circle r="26" fill="#EDE6D4" stroke="#3B3F45" stroke-width="3.5"/>
      <circle r="26" fill="none" stroke="#3B3F45" stroke-width="4" stroke-dasharray="2.5 6.5"/>
      <circle r="9" fill="#C8CDD4" stroke="#3B3F45" stroke-width="3"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
        <line x1="-30" y1="0" x2="30" y2="0" stroke="#2B2F36" stroke-width="8" stroke-linecap="round"/>
        <rect x="-44" y="-4.5" width="22" height="9" rx="2.5" fill="#1F2937" stroke="#000000" stroke-width="2"/>
        <rect x="22" y="-4.5" width="22" height="9" rx="2.5" fill="#1F2937" stroke="#000000" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>
