<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020409"/>
      <stop offset="0.45" stop-color="#071120"/>
      <stop offset="0.8" stop-color="#0c1e33"/>
      <stop offset="1" stop-color="#123049"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123049"/>
      <stop offset="0.15" stop-color="#0a1c30"/>
      <stop offset="0.6" stop-color="#05101d"/>
      <stop offset="1" stop-color="#02070d"/>
    </linearGradient>
    <linearGradient id="cloudDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2740"/>
      <stop offset="1" stop-color="#0a101e"/>
    </linearGradient>
    <linearGradient id="cloudLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aebfff"/>
      <stop offset="0.5" stop-color="#5f79c9"/>
      <stop offset="1" stop-color="#22315c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="beam" gradientUnits="userSpaceOnUse" cx="1000" cy="228" r="1500">
      <stop offset="0" stop-color="#fff7d6" stop-opacity="0.95"/>
      <stop offset="0.08" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffd98f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffd98f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.35" stop-color="#ffe9a0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4356"/>
      <stop offset="0.25" stop-color="#20283a"/>
      <stop offset="0.75" stop-color="#101623"/>
      <stop offset="1" stop-color="#070b13"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2434"/>
      <stop offset="0.4" stop-color="#0d1320"/>
      <stop offset="1" stop-color="#04070c"/>
    </linearGradient>
    <linearGradient id="rockBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243049"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfeaff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8fb0d8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="blurBig" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blurMed" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="blurBeam" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blurSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="rainFar" width="80" height="160" patternUnits="userSpaceOnUse">
      <g stroke="#a9c4ee" stroke-width="1" stroke-opacity="0.5">
        <line x1="20" y1="-10" x2="0" y2="70"/>
        <line x1="60" y1="30" x2="40" y2="110"/>
        <line x1="40" y1="90" x2="20" y2="170"/>
        <line x1="78" y1="100" x2="58" y2="180"/>
      </g>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="-80 320" dur="1.1s" repeatCount="indefinite"/>
    </pattern>
    <pattern id="rainNear" width="110" height="220" patternUnits="userSpaceOnUse">
      <g stroke="#cfe0ff" stroke-width="1.8" stroke-opacity="0.55" stroke-linecap="round">
        <line x1="30" y1="-10" x2="0" y2="110"/>
        <line x1="85" y1="40" x2="55" y2="160"/>
        <line x1="110" y1="130" x2="80" y2="250"/>
        <line x1="55" y1="150" x2="25" y2="270"/>
      </g>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="-110 440" dur="0.75s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="towerClip">
      <path d="M966,470 L978,262 L1022,262 L1034,470 Z"/>
    </clipPath>
  </defs>

  <style>
    .screen { mix-blend-mode: screen; }
    .flash  { animation: flash 10s linear infinite; opacity: 0; }
    .lit    { animation: lit   10s linear infinite; opacity: 0; }
    .bolt1  { animation: bolt1 10s linear infinite; opacity: 0; }
    .bolt2  { animation: bolt2 10s linear infinite; opacity: 0; }
    @keyframes flash {
      0%,23.8% {opacity:0} 24% {opacity:.85} 25% {opacity:.06} 26% {opacity:.6} 28%,71.8% {opacity:0}
      72% {opacity:.7} 73% {opacity:.05} 74% {opacity:.45} 76%,100% {opacity:0}
    }
    @keyframes lit {
      0%,23.8% {opacity:0} 24% {opacity:.8} 25% {opacity:.05} 26% {opacity:.55} 28%,71.8% {opacity:0}
      72% {opacity:.65} 73% {opacity:.04} 74% {opacity:.4} 76%,100% {opacity:0}
    }
    @keyframes bolt1 {
      0%,23.8% {opacity:0} 24% {opacity:1} 25.2% {opacity:0} 26% {opacity:.85} 27.4% {opacity:0} 100% {opacity:0}
    }
    @keyframes bolt2 {
      0%,71.8% {opacity:0} 72% {opacity:.95} 73% {opacity:0} 74% {opacity:.7} 75.4% {opacity:0} 100% {opacity:0}
    }
    .beamspin { transform-origin: 1000px 228px; animation: spin 9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lamp { animation: lamp 9s linear infinite; }
    @keyframes lamp { 0%,100%{opacity:1} 50%{opacity:.75} }
    .bob  { animation: bob 5.2s ease-in-out infinite; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(12px)} }
    .rock { transform-origin: 300px 600px; animation: rock 4.3s ease-in-out infinite; }
    @keyframes rock { 0%,100%{transform:rotate(-7deg)} 50%{transform:rotate(7deg)} }
    .lantern { animation: flick 0.5s ease-in-out infinite alternate; }
    @keyframes flick { from{opacity:.6} to{opacity:1} }
    .swellA { animation: swellA 8s ease-in-out infinite; }
    @keyframes swellA { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-34px,6px)} }
    .swellB { animation: swellB 6s ease-in-out infinite; }
    @keyframes swellB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,-8px)} }
    .swellC { animation: swellB 7.5s ease-in-out infinite reverse; }
    .crash  { animation: crash 4s ease-out infinite; opacity:0; }
    @keyframes crash {
      0% {transform:scale(0.2,0.2); opacity:0}
      6% {opacity:.95}
      34% {transform:scale(1.15,1.3) translateY(-14px); opacity:0}
      100% {opacity:0}
    }
    .crash2 { animation: crash 4s ease-out infinite; animation-delay: 1.7s; opacity:0; }
    .spray  { animation: spray 3.6s ease-out infinite; opacity:0; transform-box: fill-box; transform-origin: center; }
    @keyframes spray {
      0% {transform:translate(0,0) scale(0.4); opacity:0}
      8% {opacity:.9}
      100% {transform:translate(-34px,-95px) scale(1.3); opacity:0}
    }
    .spray2 { animation: spray2 4.4s ease-out infinite; opacity:0; transform-box: fill-box; transform-origin: center; }
    @keyframes spray2 {
      0% {transform:translate(0,0) scale(0.4); opacity:0}
      8% {opacity:.8}
      100% {transform:translate(28px,-80px) scale(1.2); opacity:0}
    }
  </style>

  <!-- sky -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- storm clouds -->
  <g filter="url(#blurBig)">
    <g fill="url(#cloudDark)">
      <ellipse cx="180" cy="90" rx="300" ry="90"/>
      <ellipse cx="520" cy="60" rx="340" ry="80"/>
      <ellipse cx="900" cy="100" rx="360" ry="100"/>
      <ellipse cx="1150" cy="50" rx="260" ry="80"/>
      <ellipse cx="350" cy="180" rx="260" ry="60" opacity="0.8"/>
      <ellipse cx="760" cy="190" rx="300" ry="65" opacity="0.8"/>
      <ellipse cx="1050" cy="210" rx="240" ry="55" opacity="0.7"/>
    </g>
    <g class="lit" fill="url(#cloudLit)">
      <ellipse cx="180" cy="90" rx="300" ry="90"/>
      <ellipse cx="520" cy="60" rx="340" ry="80"/>
      <ellipse cx="900" cy="100" rx="360" ry="100"/>
      <ellipse cx="1150" cy="50" rx="260" ry="80"/>
      <ellipse cx="350" cy="180" rx="260" ry="60"/>
      <ellipse cx="760" cy="190" rx="300" ry="65"/>
      <ellipse cx="1050" cy="210" rx="240" ry="55"/>
    </g>
  </g>

  <!-- lightning bolts -->
  <g class="bolt1" stroke="#dbe6ff" stroke-width="3" fill="none" filter="url(#glow)" stroke-linecap="round">
    <path d="M330,150 L310,230 L338,238 L306,330 L330,336 L296,440"/>
    <path d="M310,230 L282,290" stroke-width="1.6"/>
    <path d="M330,336 L358,392" stroke-width="1.6"/>
  </g>
  <g class="bolt2" stroke="#dbe6ff" stroke-width="2.6" fill="none" filter="url(#glow)" stroke-linecap="round">
    <path d="M620,170 L646,250 L618,258 L652,350 L628,356 L660,455"/>
    <path d="M646,250 L676,306" stroke-width="1.5"/>
  </g>

  <!-- sky flash -->
  <rect class="flash screen" width="1200" height="560" fill="#9db8ff" opacity="0"/>

  <!-- sea -->
  <rect y="520" width="1200" height="280" fill="url(#sea)"/>
  <g opacity="0.3"><rect class="flash screen" y="520" width="1200" height="280" fill="#6f8fd0"/></g>
  <g class="swellA" fill="none" stroke="#2c4a6e" stroke-opacity="0.35" stroke-width="2">
    <path d="M-60,550 Q60,538 180,550 T420,550 T660,550 T900,550 T1140,550 T1380,550"/>
    <path d="M-60,578 Q80,564 220,578 T500,578 T780,578 T1060,578 T1340,578" stroke-opacity="0.25"/>
  </g>
  <g class="swellB" fill="none" stroke="#3a5e88" stroke-opacity="0.3" stroke-width="2.5">
    <path d="M-80,610 Q70,592 220,610 T520,610 T820,610 T1120,610 T1420,610"/>
    <path d="M-80,655 Q90,635 260,655 T600,655 T940,655 T1280,655" stroke-opacity="0.22"/>
  </g>

  <!-- rotating beam -->
  <g class="beamspin screen" filter="url(#blurBeam)">
    <polygon points="1000,228 2600,-10 2600,466" fill="url(#beam)"/>
    <polygon points="1000,228 -600,-10 -600,466" fill="url(#beam)"/>
  </g>

  <!-- back ridge of cliff -->
  <path d="M700,800 L742,640 L800,560 L860,516 L930,492 L1040,484 L1140,492 L1200,486 L1200,800 Z"
        fill="url(#rockBack)" opacity="0.9"/>

  <!-- mid rock + crash -->
  <path d="M770,660 L800,600 L826,624 L852,592 L886,662 Z" fill="url(#rock)"/>
  <g class="crash" style="transform-origin:828px 640px">
    <path d="M790,648 Q806,586 828,600 Q840,566 858,604 Q876,588 872,648 Z" fill="url(#foam)" filter="url(#blurSm)"/>
  </g>
  <g fill="#dfeaff" filter="url(#blurSm)">
    <circle class="spray"  cx="806" cy="626" r="5"   style="animation-delay:0.1s"/>
    <circle class="spray"  cx="818" cy="616" r="3.5" style="animation-delay:0.35s"/>
    <circle class="spray"  cx="832" cy="610" r="4"   style="animation-delay:0.6s"/>
    <circle class="spray2" cx="846" cy="616" r="4.5" style="animation-delay:0.9s"/>
    <circle class="spray"  cx="824" cy="604" r="2.5" style="animation-delay:1.6s"/>
    <circle class="spray2" cx="856" cy="624" r="3"   style="animation-delay:2.3s"/>
    <circle class="spray"  cx="838" cy="620" r="3"   style="animation-delay:2.8s"/>
  </g>

  <!-- boat -->
  <g class="bob">
    <g class="rock">
      <path d="M252,588 L348,588 L332,614 Q300,626 268,614 Z" fill="#0a0f18"/>
      <path d="M252,588 L348,588 L344,595 L256,595 Z" fill="#26334a"/>
      <line x1="300" y1="588" x2="300" y2="534" stroke="#141c2b" stroke-width="3"/>
      <path d="M303,538 L303,582 L334,582 Z" fill="#1c2739"/>
      <path d="M297,546 L297,580 L274,580 Z" fill="#16202f"/>
      <circle class="lantern" cx="300" cy="532" r="3" fill="#ffd9a0" filter="url(#glow)"/>
    </g>
  </g>

  <!-- foreground waves -->
  <g class="swellC">
    <path d="M-80,700 Q80,678 240,700 T560,700 T880,700 T1200,700 T1520,700 L1520,800 L-80,800 Z"
          fill="#08131f"/>
    <path d="M-80,700 Q80,678 240,700 T560,700 T880,700 T1200,700 T1520,700"
          fill="none" stroke="#7fa3cc" stroke-opacity="0.35" stroke-width="2.5"/>
  </g>
  <g class="swellA">
    <path d="M-80,752 Q120,726 320,752 T720,752 T1120,752 T1520,752 L1520,800 L-80,800 Z"
          fill="#040b13"/>
    <path d="M-80,752 Q120,726 320,752 T720,752 T1120,752 T1520,752"
          fill="none" stroke="#9dbde2" stroke-opacity="0.3" stroke-width="3"/>
  </g>

  <!-- left rocks + crash -->
  <path d="M-10,800 L-10,640 L40,600 L86,646 L128,596 L178,660 L210,800 Z" fill="url(#rock)"/>
  <g class="crash2" style="transform-origin:120px 640px">
    <path d="M78,652 Q96,588 118,606 Q132,570 150,608 Q168,592 164,652 Z" fill="url(#foam)" filter="url(#blurSm)"/>
  </g>
  <g fill="#dfeaff" filter="url(#blurSm)">
    <circle class="spray2" cx="98"  cy="622" r="4.5" style="animation-delay:1.9s"/>
    <circle class="spray"  cx="116" cy="612" r="3.5" style="animation-delay:2.2s"/>
    <circle class="spray2" cx="132" cy="606" r="4"   style="animation-delay:2.6s"/>
    <circle class="spray"  cx="148" cy="618" r="3"   style="animation-delay:3.1s"/>
    <circle class="spray2" cx="124" cy="626" r="3"   style="animation-delay:3.6s"/>
  </g>

  <!-- cliff + lighthouse -->
  <path d="M760,800 L782,648 L832,566 L878,510 L932,482 L1012,472 L1104,480 L1200,470 L1200,800 Z"
        fill="url(#rock)"/>
  <path d="M878,510 L932,482 L1012,472 L1104,480 L1200,470 L1200,486 L1100,494 L1010,486 L936,496 Z"
        fill="#324260" opacity="0.55"/>
  <g fill="#000" opacity="0.45">
    <path d="M782,648 L832,566 L860,620 L820,700 Z"/>
    <path d="M878,510 L932,482 L918,560 L866,590 Z"/>
    <path d="M1040,540 L1120,500 L1200,530 L1200,640 L1080,600 Z"/>
    <path d="M900,700 L980,620 L1060,690 L1010,800 L920,800 Z"/>
  </g>
  <g fill="#42557a" opacity="0.28">
    <path d="M832,566 L878,510 L866,590 L846,610 Z"/>
    <path d="M1012,472 L1104,480 L1060,520 L1000,510 Z"/>
    <path d="M1120,500 L1200,470 L1200,530 Z"/>
  </g>
  <g clip-path="url(#towerClip)">
    <rect x="960" y="250" width="80" height="230" fill="url(#tower)"/>
    <rect x="960" y="290" width="80" height="34" fill="#8a2f3a" opacity="0.55"/>
    <rect x="960" y="368" width="80" height="34" fill="#8a2f3a" opacity="0.55"/>
    <rect x="960" y="446" width="80" height="34" fill="#8a2f3a" opacity="0.55"/>
    <rect x="976" y="250" width="5" height="230" fill="#aebfd8" opacity="0.35"/>
  </g>
  <rect x="972" y="256" width="56" height="8" rx="2" fill="#1a2233"/>
  <rect x="978" y="212" width="44" height="46" fill="#0c1220"/>
  <rect x="982" y="216" width="36" height="38" fill="#20304a"/>
  <circle class="lamp" cx="1000" cy="228" r="10" fill="#fffbe8" filter="url(#glow)"/>
  <circle class="lamp screen" cx="1000" cy="228" r="46" fill="url(#lampGlow)"/>
  <path d="M978,212 L1000,192 L1022,212 Z" fill="#141c2c"/>
  <circle cx="1000" cy="190" r="2.5" fill="#2a3852"/>

  <!-- rain -->
  <rect width="1200" height="800" fill="url(#rainFar)" opacity="0.4"/>
  <rect width="1200" height="800" fill="url(#rainNear)" opacity="0.5"/>

  <!-- vignette -->
  <rect width="1200" height="800" fill="url(#vig)"/>
</svg>
