<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8ef"/>
      <stop offset="0.6" stop-color="#bfe6f7"/>
      <stop offset="1" stop-color="#e8f6fb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f86c2"/>
      <stop offset="1" stop-color="#63b4dd"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe27a" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#ffd23f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454b57"/>
      <stop offset="1" stop-color="#333842"/>
    </linearGradient>
    <clipPath id="lhClip">
      <path d="M952,404 L961,318 L985,318 L994,404 Z"/>
    </clipPath>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="46" ry="25"/>
      <ellipse cx="-40" cy="9" rx="28" ry="17"/>
      <ellipse cx="42" cy="10" rx="30" ry="17"/>
      <ellipse cx="6" cy="-17" rx="27" ry="17"/>
    </g>
  </defs>

  <!-- SKY -->
  <rect x="0" y="0" width="1200" height="600" fill="url(#sky)"/>

  <!-- SUN -->
  <g transform="translate(170,130)">
    <g>
      <circle r="95" fill="url(#sunGlow)"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.14;1" dur="3.2s" repeatCount="indefinite"/>
    </g>
    <circle r="42" fill="#ffd23f" stroke="#f2b632" stroke-width="4"/>
    <g stroke="#ffd23f" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-58" x2="0" y2="-70"/>
      <line x1="41" y1="-41" x2="50" y2="-50"/>
      <line x1="58" y1="0" x2="70" y2="0"/>
      <line x1="41" y1="41" x2="50" y2="50"/>
      <line x1="0" y1="58" x2="0" y2="70"/>
      <line x1="-41" y1="41" x2="-50" y2="50"/>
      <line x1="-58" y1="0" x2="-70" y2="0"/>
      <line x1="-41" y1="-41" x2="-50" y2="-50"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- CLOUDS -->
  <g fill="#ffffff" opacity="0.95">
    <g>
      <use href="#cloud" transform="translate(0,120) scale(1.1)"/>
      <animateTransform attributeName="transform" type="translate" values="-320,0;1560,0" dur="95s" begin="-30s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#cloud" transform="translate(0,210) scale(0.8)"/>
      <animateTransform attributeName="transform" type="translate" values="-260,0;1560,0" dur="130s" begin="-95s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#cloud" transform="translate(0,80) scale(0.65)"/>
      <animateTransform attributeName="transform" type="translate" values="-200,0;1560,0" dur="110s" begin="-60s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#cloud" transform="translate(0,270) scale(0.55)"/>
      <animateTransform attributeName="transform" type="translate" values="-180,0;1560,0" dur="150s" begin="-20s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- TINY FLYING BIRDS -->
  <g fill="none" stroke="#5a6b7d" stroke-width="2.5" stroke-linecap="round">
    <g>
      <path d="M0,0 Q7,-8 14,0 Q21,-8 28,0">
        <animate attributeName="d" values="M0,0 Q7,-8 14,0 Q21,-8 28,0;M0,0 Q7,4 14,0 Q21,4 28,0;M0,0 Q7,-8 14,0 Q21,-8 28,0" dur="0.7s" repeatCount="indefinite"/>
      </path>
      <animateTransform attributeName="transform" type="translate" values="240,170;1000,140" dur="46s" begin="-8s" repeatCount="indefinite"/>
    </g>
    <g>
      <path d="M0,0 Q5,-6 10,0 Q15,-6 20,0">
        <animate attributeName="d" values="M0,0 Q5,-6 10,0 Q15,-6 20,0;M0,0 Q5,3 10,0 Q15,3 20,0;M0,0 Q5,-6 10,0 Q15,-6 20,0" dur="0.6s" begin="-0.2s" repeatCount="indefinite"/>
      </path>
      <animateTransform attributeName="transform" type="translate" values="300,225;1060,195" dur="52s" begin="-26s" repeatCount="indefinite"/>
    </g>
    <g>
      <path d="M0,0 Q4,-5 8,0 Q12,-5 16,0">
        <animate attributeName="d" values="M0,0 Q4,-5 8,0 Q12,-5 16,0;M0,0 Q4,2 8,0 Q12,2 16,0;M0,0 Q4,-5 8,0 Q12,-5 16,0" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
      </path>
      <animateTransform attributeName="transform" type="translate" values="200,250;980,225" dur="60s" begin="-40s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- DISTANT HILLS -->
  <path d="M0,440 Q120,378 260,412 Q380,438 470,440 Z" fill="#9dc3d3"/>
  <path d="M330,440 Q470,368 620,418 Q720,440 800,440 Z" fill="#86b4c8"/>
  <path d="M700,440 Q850,352 1010,398 Q1120,424 1200,412 L1200,440 Z" fill="#a8cdd9"/>
  <path d="M860,440 Q960,392 1090,414 Q1160,426 1200,424 L1200,440 Z" fill="#7fb0a6"/>

  <!-- LIGHTHOUSE -->
  <g>
    <path d="M952,404 L961,318 L985,318 L994,404 Z" fill="#f7f3ea" stroke="#3a3f4a" stroke-width="3"/>
    <g clip-path="url(#lhClip)">
      <rect x="945" y="330" width="60" height="16" fill="#e0492e"/>
      <rect x="945" y="362" width="60" height="16" fill="#e0492e"/>
      <rect x="945" y="392" width="60" height="14" fill="#e0492e"/>
    </g>
    <path d="M952,404 L961,318 L985,318 L994,404" fill="none" stroke="#3a3f4a" stroke-width="3"/>
    <rect x="957" y="304" width="32" height="16" rx="2" fill="#ffd23f" stroke="#3a3f4a" stroke-width="3"/>
    <path d="M955,304 L973,288 L991,304 Z" fill="#e0492e" stroke="#3a3f4a" stroke-width="3"/>
    <circle cx="973" cy="312" r="26" fill="#ffd23f" opacity="0.25">
      <animate attributeName="opacity" values="0.12;0.35;0.12" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- SEA -->
  <rect x="0" y="440" width="1200" height="148" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="3">
    <line x1="120" y1="470" x2="170" y2="470" opacity="0.3">
      <animate attributeName="opacity" values="0.12;0.55;0.12" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="330" y1="492" x2="395" y2="492" opacity="0.3">
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.1s" repeatCount="indefinite"/>
    </line>
    <line x1="560" y1="466" x2="610" y2="466" opacity="0.3">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.8s" begin="-1s" repeatCount="indefinite"/>
    </line>
    <line x1="760" y1="505" x2="830" y2="505" opacity="0.3">
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="2.2s" begin="-0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="950" y1="478" x2="1000" y2="478" opacity="0.3">
      <animate attributeName="opacity" values="0.12;0.5;0.12" dur="3.4s" begin="-2s" repeatCount="indefinite"/>
    </line>
    <line x1="1080" y1="520" x2="1140" y2="520" opacity="0.3">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.6s" begin="-1.4s" repeatCount="indefinite"/>
    </line>
    <line x1="220" y1="540" x2="280" y2="540" opacity="0.3">
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="640" y1="552" x2="700" y2="552" opacity="0.3">
      <animate attributeName="opacity" values="0.45;0.12;0.45" dur="2.5s" begin="-1.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- PIER -->
  <g>
    <g fill="#8a5a33">
      <rect x="52" y="548" width="10" height="38"/>
      <rect x="132" y="548" width="10" height="38"/>
      <rect x="212" y="548" width="10" height="38"/>
      <rect x="278" y="548" width="10" height="38"/>
    </g>
    <rect x="28" y="538" width="272" height="12" rx="3" fill="#b07a4a" stroke="#7d5533" stroke-width="3"/>
    <g stroke="#b07a4a" stroke-width="5" stroke-linecap="round">
      <line x1="36" y1="504" x2="292" y2="504"/>
      <line x1="40" y1="504" x2="40" y2="538"/>
      <line x1="100" y1="504" x2="100" y2="538"/>
      <line x1="160" y1="504" x2="160" y2="538"/>
      <line x1="220" y1="504" x2="220" y2="538"/>
      <line x1="288" y1="504" x2="288" y2="538"/>
    </g>
  </g>

  <!-- SHORE -->
  <rect x="0" y="588" width="1200" height="30" fill="#a9d49a"/>
  <g fill="#8bbf7d">
    <path d="M60,588 q8,-14 16,0 Z"/>
    <path d="M340,588 q8,-14 16,0 Z"/>
    <path d="M840,588 q8,-14 16,0 Z"/>
    <path d="M1120,588 q8,-14 16,0 Z"/>
  </g>

  <!-- ROAD -->
  <rect x="0" y="616" width="1200" height="8" fill="#cfd6dd"/>
  <rect x="0" y="624" width="1200" height="176" fill="url(#road)"/>
  <line x1="0" y1="738" x2="1200" y2="738" stroke="#f4c542" stroke-width="8" stroke-dasharray="46 34">
    <animate attributeName="stroke-dashoffset" values="0;80" dur="0.55s" repeatCount="indefinite"/>
  </line>

  <!-- SHADOW -->
  <ellipse cx="565" cy="730" rx="185" ry="13" fill="#000000" opacity="0.18"/>

  <!-- ================= BIKE + BIRD RIG ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="0.7s" repeatCount="indefinite"/>

    <!-- FAR LEG (behind frame) -->
    <g>
      <polyline fill="none" stroke="#d96f1f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
        points="536,514 588.5,574.4 533,632">
        <animate attributeName="points" dur="1.2s" repeatCount="indefinite"
          values="536,514 588.5,574.4 533,632;536,514 598.3,564.2 537.3,616;536,514 607.6,549.8 549,604.3;536,514 612.9,535.9 565,600;536,514 614.1,531.4 581,604.3;536,514 612.2,538.4 592.7,616;536,514 606.1,552.5 597,632;536,514 595,568 592.7,648;536,514 581.6,579.7 581,659.7;536,514 573.8,584.5 565,664;536,514 574.8,584 549,659.7;536,514 580.4,580.6 537.3,648;536,514 588.5,574.4 533,632"/>
      </polyline>
      <ellipse rx="11" ry="6" fill="#d96f1f" cx="533" cy="632">
        <animate attributeName="cx" dur="1.2s" repeatCount="indefinite" values="533;537.3;549;565;581;592.7;597;592.7;581;565;549;537.3;533"/>
        <animate attributeName="cy" dur="1.2s" repeatCount="indefinite" values="632;616;604.3;600;604.3;616;632;648;659.7;664;659.7;648;632"/>
      </ellipse>
    </g>

    <!-- FAR CRANK -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 565 632" to="360 565 632" dur="1.2s" repeatCount="indefinite"/>
      <line x1="565" y1="632" x2="533" y2="632" stroke="#4a505a" stroke-width="7" stroke-linecap="round"/>
      <g>
        <rect x="521" y="629" width="24" height="7" rx="3" fill="#4a505a"/>
        <animateTransform attributeName="transform" type="rotate" from="0 533 632" to="-360 533 632" dur="1.2s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- REAR WHEEL -->
    <g>
      <circle cx="420" cy="640" r="80" fill="none" stroke="#22252b" stroke-width="11"/>
      <g>
        <circle cx="420" cy="640" r="73" fill="none" stroke="#f3e6c8" stroke-width="6"/>
        <g stroke="#b9a87e" stroke-width="2.5">
          <line x1="350" y1="640" x2="490" y2="640"/>
          <line x1="370.5" y1="590.5" x2="469.5" y2="689.5"/>
          <line x1="420" y1="570" x2="420" y2="710"/>
          <line x1="469.5" y1="590.5" x2="370.5" y2="689.5"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 420 640" to="360 420 640" dur="0.8s" repeatCount="indefinite"/>
      </g>
      <circle cx="420" cy="640" r="9" fill="#f3e6c8" stroke="#22252b" stroke-width="3"/>
    </g>

    <!-- FRONT WHEEL -->
    <g>
      <circle cx="710" cy="640" r="80" fill="none" stroke="#22252b" stroke-width="11"/>
      <g>
        <circle cx="710" cy="640" r="73" fill="none" stroke="#f3e6c8" stroke-width="6"/>
        <g stroke="#b9a87e" stroke-width="2.5">
          <line x1="640" y1="640" x2="780" y2="640"/>
          <line x1="660.5" y1="590.5" x2="759.5" y2="689.5"/>
          <line x1="710" y1="570" x2="710" y2="710"/>
          <line x1="759.5" y1="590.5" x2="660.5" y2="689.5"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 710 640" to="360 710 640" dur="0.8s" repeatCount="indefinite"/>
      </g>
      <circle cx="710" cy="640" r="9" fill="#f3e6c8" stroke="#22252b" stroke-width="3"/>
    </g>

    <!-- CHAIN -->
    <path d="M561.3,606.3 L418.1,627.1 A13,13 0 0 0 419.6,653 L564.1,658 A26,26 0 0 0 561.3,606.3 Z"
      fill="none" stroke="#2b2f36" stroke-width="5" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" values="0;-84" dur="0.6s" repeatCount="indefinite"/>
    </path>

    <!-- REAR COG -->
    <circle cx="420" cy="640" r="13" fill="#8b939c" stroke="#2b2f36" stroke-width="3"/>
    <circle cx="420" cy="640" r="4" fill="#2b2f36"/>

    <!-- FRAME -->
    <g stroke="#e0492e" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="420" y1="640" x2="538" y2="512"/>
      <line x1="420" y1="640" x2="565" y2="632"/>
      <line x1="565" y1="632" x2="538" y2="512"/>
      <line x1="538" y1="512" x2="690" y2="500"/>
      <line x1="565" y1="632" x2="706" y2="545"/>
      <line x1="690" y1="500" x2="706" y2="545"/>
      <path d="M706,545 Q714,585 710,640"/>
    </g>

    <!-- CHAINRING -->
    <circle cx="565" cy="632" r="26" fill="#cfd6dd" stroke="#8b939c" stroke-width="3"/>
    <g>
      <g stroke="#8b939c" stroke-width="4">
        <line x1="565" y1="632" x2="583" y2="632"/>
        <line x1="565" y1="632" x2="547" y2="632"/>
        <line x1="565" y1="632" x2="565" y2="614"/>
        <line x1="565" y1="632" x2="565" y2="650"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 565 632" to="360 565 632" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <circle cx="565" cy="632" r="6" fill="#8b939c"/>

    <!-- REAR RACK + PANNIER -->
    <g stroke="#2b2f36" stroke-width="5" stroke-linecap="round" fill="none">
      <line x1="392" y1="558" x2="474" y2="558"/>
      <line x1="474" y1="558" x2="530" y2="516"/>
      <line x1="412" y1="558" x2="420" y2="600"/>
    </g>
    <g>
      <rect x="396" y="562" width="58" height="52" rx="8" fill="#3f9d5a" stroke="#2c6e40" stroke-width="3"/>
      <path d="M396,578 L454,578" stroke="#2c6e40" stroke-width="3"/>
      <rect x="418" y="572" width="14" height="12" rx="2" fill="#f3e6c8" stroke="#2c6e40" stroke-width="2.5"/>
    </g>

    <!-- BASKET -->
    <g>
      <path d="M712,516 L772,516 L763,558 L721,558 Z" fill="#d9913f" stroke="#a86a24" stroke-width="3"/>
      <g stroke="#a86a24" stroke-width="2.5">
        <line x1="715" y1="530" x2="769" y2="530"/>
        <line x1="718" y1="544" x2="766" y2="544"/>
        <line x1="731" y1="516" x2="733" y2="558"/>
        <line x1="753" y1="516" x2="751" y2="558"/>
      </g>
    </g>

    <!-- SADDLE -->
    <line x1="538" y1="512" x2="534" y2="502" stroke="#2b2f36" stroke-width="6"/>
    <path d="M508,506 Q529,496 556,502 Q548,512 526,512 Z" fill="#2b2f36"/>

    <!-- HANDLEBAR -->
    <g stroke="#2b2f36" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="690" y1="500" x2="684" y2="484"/>
      <path d="M684,484 Q672,472 656,478"/>
    </g>

    <!-- ================= BIRD ================= -->
    <!-- tail -->
    <path d="M480,414 Q420,394 404,418 Q420,448 480,446 Z" fill="#ffffff" stroke="#3a3f4a" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M424,414 Q444,424 442,438" fill="none" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round"/>

    <!-- body -->
    <ellipse cx="540" cy="452" rx="78" ry="60" transform="rotate(-8 540 452)" fill="#ffffff" stroke="#3a3f4a" stroke-width="4"/>

    <!-- scarf trailing end (over body) -->
    <path fill="#e03a2f" stroke="#a92a20" stroke-width="3" stroke-linejoin="round"
      d="M614,404 Q566,392 520,402 Q490,408 470,396 Q492,382 534,386 Q580,384 612,394 Z">
      <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
        values="M614,404 Q566,392 520,402 Q490,408 470,396 Q492,382 534,386 Q580,384 612,394 Z;
                M614,404 Q568,404 524,390 Q494,382 474,394 Q496,408 538,398 Q582,400 612,398 Z;
                M614,404 Q566,392 520,402 Q490,408 470,396 Q492,382 534,386 Q580,384 612,394 Z"/>
    </path>
    <path fill="#c92f26" stroke="#a92a20" stroke-width="2.5" stroke-linejoin="round"
      d="M612,414 Q570,408 534,418 Q510,424 494,414 Q512,402 546,406 Q584,406 610,408 Z">
      <animate attributeName="d" dur="1.1s" begin="-0.3s" repeatCount="indefinite"
        values="M612,414 Q570,408 534,418 Q510,424 494,414 Q512,402 546,406 Q584,406 610,408 Z;
                M612,414 Q572,420 538,408 Q514,402 498,412 Q516,424 550,418 Q586,418 610,414 Z;
                M612,414 Q570,408 534,418 Q510,424 494,414 Q512,402 546,406 Q584,406 610,408 Z"/>
    </path>

    <!-- neck -->
    <path d="M582,432 Q606,378 640,358 L672,382 Q642,404 616,452 Z" fill="#ffffff" stroke="#3a3f4a" stroke-width="4" stroke-linejoin="round"/>

    <!-- scarf knot -->
    <path d="M606,398 Q638,414 668,396 L664,414 Q636,428 610,414 Z" fill="#e03a2f" stroke="#a92a20" stroke-width="3" stroke-linejoin="round"/>

    <!-- head -->
    <circle cx="655" cy="372" r="30" fill="#ffffff" stroke="#3a3f4a" stroke-width="4"/>

    <!-- beak -->
    <path d="M676,358 L766,382 Q773,388 764,394 L704,406 Q680,400 672,380 Z" fill="#f5872e" stroke="#c96a1c" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M688,390 Q722,400 754,388" fill="none" stroke="#c96a1c" stroke-width="2.5"/>

    <!-- eye -->
    <circle cx="664" cy="360" r="5.5" fill="#23262c"/>
    <circle cx="666" cy="358" r="1.8" fill="#ffffff"/>
    <circle cx="648" cy="378" r="5" fill="#f6b8ac" opacity="0.7"/>

    <!-- cap -->
    <path d="M627,358 Q628,328 656,326 Q684,328 685,356 Q656,346 627,358 Z" fill="#3aa655" stroke="#2c7a40" stroke-width="3" stroke-linejoin="round"/>
    <path d="M681,350 Q702,348 706,357 Q693,362 680,359 Z" fill="#2c7a40" stroke="#2c7a40" stroke-width="2"/>
    <circle cx="656" cy="326" r="4" fill="#2c7a40"/>

    <!-- wing gripping handlebar -->
    <path d="M556,414 Q636,418 660,470 Q638,486 598,478 Q558,470 546,438 Z" fill="#f2f4f7" stroke="#3a3f4a" stroke-width="4" stroke-linejoin="round"/>
    <g fill="none" stroke="#b9c2cc" stroke-width="3" stroke-linecap="round">
      <path d="M580,432 Q612,440 634,462"/>
      <path d="M570,448 Q600,456 620,472"/>
    </g>
    <!-- wing tip gripping the handlebar -->
    <path d="M648,466 Q664,460 670,472 Q662,484 648,480 Q642,472 648,466 Z" fill="#f2f4f7" stroke="#3a3f4a" stroke-width="3.5"/>

    <!-- NEAR CRANK -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 565 632" to="360 565 632" dur="1.2s" repeatCount="indefinite"/>
      <line x1="565" y1="632" x2="597" y2="632" stroke="#2b2f36" stroke-width="7" stroke-linecap="round"/>
      <g>
        <rect x="585" y="629" width="24" height="7" rx="3" fill="#2b2f36"/>
        <animateTransform attributeName="transform" type="rotate" from="0 597 632" to="-360 597 632" dur="1.2s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- NEAR LEG -->
    <g>
