<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF</title>
<style>
:root{--bg:#3a3f46;--bar:#1f2329;--ink:#e8ecf1;--mut:#9aa4b1;--acc:#4c8dff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.3 system-ui,"Segoe UI",sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bar);box-shadow:0 1px 6px rgba(0,0,0,.35)}
.bar .nm{font:600 13px Consolas,monospace;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{font:600 13px system-ui;background:#2c323a;color:var(--ink);border:1px solid #444c56;border-radius:6px;padding:5px 10px;cursor:pointer}
.bar button:hover{border-color:var(--acc)}
.bar .pg,.bar .zm{font:600 12px Consolas,monospace;color:var(--mut);min-width:64px;text-align:center}
#pages{display:grid;justify-items:center;gap:14px;padding:18px 10px 60px}
.page{position:relative;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35);max-width:none}
.page canvas{display:block}
.page.wait::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;border:3px solid rgba(0,0,0,.12);border-top-color:var(--acc);animation:sp .8s linear infinite}
#msg{display:grid;place-items:center;gap:12px;height:70vh;color:var(--mut)}
#msg::before{content:"";width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--acc);animation:sp .8s linear infinite}
#msg.err::before{display:none}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bar"><span class="nm" id="nm">PDF</span>
  <button type="button" id="out" title="Zoom out">&minus;</button><span class="zm" id="zm">fit</span><button type="button" id="in" title="Zoom in">+</button>
  <button type="button" id="fit" title="Fit to width">Fit width</button><span class="pg" id="pg"></span></div>
<div id="msg">Loading the PDF&hellip;</div>
<div id="pages"></div>
<script src="pdf.min.js"></script>
<script src="pdf.worker.min.js"></script>
<script>
(function () {
  var key = (new URLSearchParams(location.search).get('f') || '').replace(/[^A-Za-z0-9_-]/g, '');
  var msg = document.getElementById('msg'), box = document.getElementById('pages');
  document.getElementById('nm').textContent = key.replace('-', ' · ') + ' · paper.pdf';
  var s = document.createElement('script'); s.src = key + '.pdf.js';
  s.onerror = function () { msg.className = 'err'; msg.textContent = 'This PDF could not be loaded.'; };
  s.onload = start; document.head.appendChild(s);
  var doc = null, scale = 0, fitMode = true, pages = [], io = null;
  function start() {
    var bin = atob(window.__PDF), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    pdfjsLib.getDocument({ data: u8, isEvalSupported: false }).promise.then(function (d) {
      doc = d; msg.remove(); layout();
    }, function (e) { msg.className = 'err'; msg.textContent = 'This PDF could not be opened: ' + e.message; });
  }
  function fitScale(vp) { return Math.max(0.3, (box.clientWidth - 30) / vp.width); }
  function layout() {
    box.innerHTML = ''; pages = [];
    if (io) io.disconnect();
    io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) draw(e.target); }); }, { rootMargin: '600px 0px' });
    doc.getPage(1).then(function (p1) {
      var vp1 = p1.getViewport({ scale: 1 });
      if (fitMode) scale = Math.min(fitScale(vp1), 1.6);
      document.getElementById('zm').textContent = Math.round(scale * 100) + '%';
      for (var n = 1; n <= doc.numPages; n++) {
        var d = document.createElement('div'); d.className = 'page wait'; d.dataset.n = n;
        d.style.width = vp1.width * scale + 'px'; d.style.height = vp1.height * scale + 'px';
        box.appendChild(d); pages.push(d); io.observe(d);
      }
      updPg();
    });
  }
  function draw(d) {
    if (d.dataset.done == String(scale)) return; d.dataset.done = String(scale);
    doc.getPage(+d.dataset.n).then(function (p) {
      var vp = p.getViewport({ scale: scale }), dpr = window.devicePixelRatio || 1;
      var c = document.createElement('canvas'); c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr);
      c.style.width = vp.width + 'px'; c.style.height = vp.height + 'px';
      d.style.width = vp.width + 'px'; d.style.height = vp.height + 'px';
      p.render({ canvasContext: c.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise.then(function () {
        d.innerHTML = ''; d.appendChild(c); d.classList.remove('wait');
      });
    });
  }
  function updPg() {
    var y = window.innerHeight / 3, cur = 1;
    pages.forEach(function (d) { if (d.getBoundingClientRect().top < y) cur = +d.dataset.n; });
    document.getElementById('pg').textContent = doc ? cur + ' / ' + doc.numPages : '';
  }
  addEventListener('scroll', updPg, { passive: true });
  function zoom(f) { if (!doc) return; fitMode = false; scale = Math.min(4, Math.max(0.3, scale * f)); layout(); }
  document.getElementById('in').onclick = function () { zoom(1.2); };
  document.getElementById('out').onclick = function () { zoom(1 / 1.2); };
  document.getElementById('fit').onclick = function () { if (!doc) return; fitMode = true; layout(); };
  var rt; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (doc && fitMode) layout(); }, 200); });
})();
</script>
</body>
</html>
